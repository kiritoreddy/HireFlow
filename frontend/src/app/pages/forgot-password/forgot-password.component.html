<div class="forgot-page">
  <mat-card class="forgot-card">
    <mat-card-header>
      <mat-card-title>Forgot password?</mat-card-title>
      <mat-card-subtitle>Enter your email and we'll send reset instructions.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      @if (!submitted) {
        <form (ngSubmit)="onSubmit()" class="forgot-form">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput [(ngModel)]="email" name="email" type="email" required autocomplete="email" />
          </mat-form-field>
          <button mat-flat-button color="primary" type="submit" class="submit-btn">
            Send reset link
          </button>
        </form>
      } @else {
        <p class="success-msg">If an account exists for that email, we've sent reset instructions.</p>
        <p class="demo-hint">Demo: use the link below to try the reset flow.</p>
        <a mat-button routerLink="/reset-password" class="demo-link">
          Use demo reset link
        </a>
      }
      <a mat-button routerLink="/login" class="back-link">Back to sign in</a>
    </mat-card-content>
  </mat-card>
</div>
