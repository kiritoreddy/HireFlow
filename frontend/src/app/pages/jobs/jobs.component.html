<div class="jobs-page">
  <header class="page-header">
    <div class="header-text">
      <h1 class="page-title">Jobs</h1>
      <p class="subtitle">View and manage open and closed job postings</p>
    </div>
    <button mat-flat-button color="primary" class="add-job-btn" disabled title="Coming soon">
      <mat-icon>add</mat-icon>
      Add job
    </button>
  </header>

  <mat-card class="table-card">
    <div class="table-wrap">
      <table mat-table [dataSource]="dataSource" class="jobs-table">
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Title</th>
          <td mat-cell *matCellDef="let row">
            <span class="cell-title">{{ row.title }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let row">
            <span class="cell-desc">{{ row.description || '—' }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="department">
          <th mat-header-cell *matHeaderCellDef>Department</th>
          <td mat-cell *matCellDef="let row">{{ row.department || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="location">
          <th mat-header-cell *matHeaderCellDef>Location</th>
          <td mat-cell *matCellDef="let row">{{ row.location || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row">
            <span class="status-badge" [class.closed]="row.status === 'Closed'">{{ row.status }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <a mat-button color="primary" [routerLink]="['/jobs', row.id, 'candidates']">
              View candidates
            </a>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr class="mat-row no-data" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">No jobs yet.</td>
        </tr>
      </table>
    </div>
  </mat-card>
</div>
