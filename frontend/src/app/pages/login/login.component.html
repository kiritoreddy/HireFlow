<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header class="login-header">
      <mat-card-title>Sign in to HireFlow</mat-card-title>
      <p class="login-subtitle">Welcome back. Please enter your details.</p>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input
            matInput
            [(ngModel)]="email"
            name="email"
            type="email"
            required
            autocomplete="email"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            [(ngModel)]="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
          />
        </mat-form-field>

        @if (error) {
          <p class="error">{{ error }}</p>
        }

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="submit-btn"
          [disabled]="loading"
        >
          {{ loading ? 'Signing in…' : 'Sign in' }}
        </button>

        <a mat-button routerLink="/forgot-password" class="forgot-link">
          Forgot password?
        </a>

        @if (resetSuccess) {
          <p class="success-msg">Password reset. Sign in with your new password.</p>
        }
      </form>
    </mat-card-content>
  </mat-card>
</div>
