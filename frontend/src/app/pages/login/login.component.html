<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Sign in to HireFlow</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput [(ngModel)]="username" name="username" type="text" required autocomplete="username" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [(ngModel)]="password" name="password" type="password" required autocomplete="current-password" />
        </mat-form-field>
        @if (error) {
          <p class="error">{{ error }}</p>
        }
        <button mat-flat-button color="primary" type="submit" class="submit-btn">
          Sign in
        </button>
        <p class="dev-hint">Demo: admin / admin123</p>
      </form>
    </mat-card-content>
  </mat-card>
</div>
