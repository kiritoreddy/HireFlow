<div class="reset-page">
  <mat-card class="reset-card">
    <mat-card-header>
      <mat-card-title>Set new password</mat-card-title>
      <mat-card-subtitle>Enter your new password below.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="onSubmit()" class="reset-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New password</mat-label>
          <input
            matInput
            [(ngModel)]="password"
            name="password"
            [type]="hidePassword ? 'password' : 'text'"
            required
            minlength="6"
            autocomplete="new-password"
          />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" aria-label="Toggle visibility">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm password</mat-label>
          <input
            matInput
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            [type]="hideConfirm ? 'password' : 'text'"
            required
            minlength="6"
            autocomplete="new-password"
          />
          <button mat-icon-button matSuffix type="button" (click)="hideConfirm = !hideConfirm" aria-label="Toggle visibility">
            <mat-icon>{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
        @if (error) {
          <p class="error">{{ error }}</p>
        }
        <button mat-flat-button color="primary" type="submit" class="submit-btn">
          Reset password
        </button>
      </form>
      <a mat-button routerLink="/login" class="back-link">Back to sign in</a>
    </mat-card-content>
  </mat-card>
</div>
