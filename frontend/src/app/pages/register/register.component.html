<div class="register-page">
  <mat-card class="register-card">
    <div class="login-brand">
      <span class="brand-dark">Hire</span><span class="brand-accent">Flow</span>
    </div>

    <mat-card-header class="register-header">
      <mat-card-title>Create an account</mat-card-title>
      <p class="register-subtitle">Sign up as a candidate to apply for jobs.</p>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSubmit()" class="register-form">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Full Name</mat-label>
          <input
            matInput
            [(ngModel)]="name"
            name="name"
            type="text"
            required
            autocomplete="name"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input
            matInput
            [(ngModel)]="email"
            name="email"
            type="email"
            required
            autocomplete="email"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            [(ngModel)]="password"
            name="password"
            [type]="hidePassword ? 'password' : 'text'"
            required
            autocomplete="new-password"
          />
          <button mat-icon-button matSuffix type="button"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'">
            <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input
            matInput
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            [type]="hideConfirm ? 'password' : 'text'"
            required
            autocomplete="new-password"
          />
          <button mat-icon-button matSuffix type="button"
            (click)="hideConfirm = !hideConfirm"
            [attr.aria-label]="hideConfirm ? 'Show password' : 'Hide password'">
            <mat-icon>{{ hideConfirm ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </mat-form-field>

        @if (error) {
          <p class="error">{{ error }}</p>
        }

        @if (success) {
          <p class="success-msg">{{ success }}</p>
        }

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="submit-btn"
          [disabled]="loading || googleLoading"
        >
          {{ loading ? 'Creating account…' : 'Create account' }}
        </button>

        <div class="divider-row">
          <span class="divider-line"></span>
          <span class="divider-text">or</span>
          <span class="divider-line"></span>
        </div>

        <div id="google-register-btn" class="gis-btn-container"></div>
        @if (!googleAvailable) {
          <button
            mat-stroked-button
            type="button"
            class="google-btn"
            (click)="signUpWithGoogle()"
            [disabled]="loading || googleLoading"
          >
            @if (googleLoading) {
              <mat-spinner diameter="20" class="btn-spinner"></mat-spinner>
              Continuing with Google…
            } @else {
              <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              Continue with Google
            }
          </button>
        }

        <p class="signin-link">
          Already have an account?
          <a routerLink="/login">Sign in</a>
        </p>

      </form>
    </mat-card-content>
  </mat-card>
</div>
