<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <p class="hint">Passwords are not stored or editable here. Default password is first 4 letters of email + @1234.</p>
  <form class="user-form" (ngSubmit)="save()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>First name</mat-label>
      <input matInput [(ngModel)]="firstName" name="firstName" required />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Last name</mat-label>
      <input matInput [(ngModel)]="lastName" name="lastName" required />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput [(ngModel)]="email" name="email" type="email" required />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Role</mat-label>
      <mat-select [(ngModel)]="role" name="role" required>
        @for (r of roles; track r.value) {
          <mat-option [value]="r.value">{{ r.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
