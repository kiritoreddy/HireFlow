<div class="job-candidates-page">
  <div class="header-row">
    <h2>{{ jobTitle }} — Candidates</h2>
    <button mat-raised-button color="primary" (click)="openAddCandidateDialog()">
      + Add Candidate
    </button>
  </div>

  <div class="table-wrap">
    <table mat-table [dataSource]="dataSource" class="candidates-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>
      <ng-container matColumnDef="resume">
        <th mat-header-cell *matHeaderCellDef>Resume</th>
        <td mat-cell *matCellDef="let row">{{ row.resume }}</td>
      </ng-container>
      <ng-container matColumnDef="stage">
        <th mat-header-cell *matHeaderCellDef>Stage</th>
        <td mat-cell *matCellDef="let row">
          <mat-select
            [value]="row.stage"
            (selectionChange)="onStageChange(row, $event.value)"
            class="stage-select"
          >
            @for (s of stages; track s) {
              <mat-option [value]="s">{{ s }}</mat-option>
            }
          </mat-select>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr class="mat-row no-data" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">No candidates yet. Add one to get started.</td>
      </tr>
    </table>
  </div>
</div>
