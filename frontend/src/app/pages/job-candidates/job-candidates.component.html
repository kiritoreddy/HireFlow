<div
  style="
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  "
>
  <h2>Candidates</h2>

  <button
    mat-raised-button
    color="primary"
    style="padding: 12px 28px; font-size: 16px;"
    (click)="openAddCandidateDialog()"
  >
    + Add Candidate
  </button>
</div>

<ag-grid-angular
  class="ag-theme-alpine"
  style="width: 100%; height: 500px;"
  [columnDefs]="columnDefs"
  [rowData]="rowData"
>
</ag-grid-angular>
