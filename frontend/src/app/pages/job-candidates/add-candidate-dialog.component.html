<h2 mat-dialog-title class="dialog-title">Add Candidate</h2>

<mat-dialog-content class="dialog-content">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Full name</mat-label>
    <input matInput [(ngModel)]="name" name="name" autocomplete="name" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Email</mat-label>
    <input
      matInput
      [(ngModel)]="email"
      name="email"
      type="email"
      autocomplete="email"
    />
  </mat-form-field>

  <div class="resume-section">
    <label class="resume-label" for="resumeFile">Resume</label>
    <input
      #fileInput
      id="resumeFile"
      type="file"
      accept=".pdf,.doc,.docx"
      (change)="onFileChange($event)"
      class="file-input"
    />
    <p class="file-text">{{ resume || 'No file selected' }}</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="addCandidate()">
    Add Candidate
  </button>
</mat-dialog-actions>
