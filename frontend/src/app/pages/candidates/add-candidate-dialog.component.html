<h2 mat-dialog-title>Add Candidate</h2>

<div mat-dialog-content style="display: flex; flex-direction: column; gap: 16px;">
  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>Name</mat-label>
    <input
      matInput
      name="name"
      [(ngModel)]="name"
      [ngModelOptions]="{ standalone: true }"
      placeholder="Enter candidate name"
    />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>Email</mat-label>
    <input
      matInput
      type="email"
      name="email"
      [(ngModel)]="email"
      [ngModelOptions]="{ standalone: true }"
      placeholder="Enter candidate email"
    />
  </mat-form-field>

  <div>
    <label style="font-weight: 500;">Resume</label><br />
    <input type="file" />
  </div>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="closeDialog()">Cancel</button>
  <button mat-raised-button color="primary" (click)="addCandidate()">
    Add
  </button>
</div>
