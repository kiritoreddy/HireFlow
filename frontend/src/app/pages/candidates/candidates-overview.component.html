<h1 class="page-title">Candidates</h1>
<p class="subtitle">View and manage candidates across all jobs</p>

<div class="cards">
  <div class="card" *ngFor="let job of jobsWithCounts">
    <div class="card-header">
      <div>
        <h2>{{ job.title }}</h2>
        <span>{{ job.department }}</span>
      </div>
      <span class="badge" [class.closed]="job.status === 'Closed'">{{ job.status }}</span>
    </div>

    <div class="stats">
      <div>Applied {{ job.applied }}</div>
      <div>Interview {{ job.interview }}</div>
      <div>Selected {{ job.selected }}</div>
      <div>Rejected {{ job.rejected }}</div>
    </div>

    <a
      class="view-btn"
      [routerLink]="['/jobs', job.id, 'candidates']"
    >
      View {{ job.total }} Candidates →
    </a>
  </div>
</div>
