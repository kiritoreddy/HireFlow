<div class="app-layout">
  <header class="app-header">
    <a mat-button [routerLink]="isCandidate ? '/portal/jobs' : '/dashboard'" class="app-logo">
      <span class="logo-text">
        <span class="logo-hire">Hire</span><span class="logo-flow">Flow</span>
      </span>
    </a>

    <span class="app-header-spacer"></span>

    <button
      mat-icon-button
      class="profile-icon"
      [matMenuTriggerFor]="profileMenu"
      aria-label="Profile"
    >
      <mat-icon>account_circle</mat-icon>
    </button>

    <mat-menu #profileMenu="matMenu" panelClass="profile-menu" xPosition="before">
      <div class="profile-menu-header">
        <mat-icon>account_circle</mat-icon>
        <span class="profile-name">{{ currentUser?.displayName ?? 'User' }}</span>
      </div>

      <mat-divider></mat-divider>

      <div class="profile-details">
        <div class="profile-row">
          <span class="label">Email</span>
          <span class="value">{{ currentUser?.email ?? '—' }}</span>
        </div>

        <div class="profile-row">
          <span class="label">Role</span>
          <span class="value">{{ currentUser?.role ?? '—' }}</span>
        </div>
      </div>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </header>

  <div class="app-body">
    <nav class="app-sidebar">
      <div class="nav-group">
        @if (isCandidate) {
          <a
            mat-button
            routerLink="/portal/jobs"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
          >
            <mat-icon>work</mat-icon>
            <span>Open roles</span>
          </a>
          <a
            mat-button
            routerLink="/portal/applications"
            routerLinkActive="active"
            class="nav-link"
          >
            <mat-icon>assignment</mat-icon>
            <span>My applications</span>
          </a>
        } @else {
          <a
            mat-button
            routerLink="/dashboard"
            routerLinkActive="active"
            class="nav-link"
          >
            <mat-icon>dashboard</mat-icon>
            <span>Dashboard</span>
          </a>

          <a
            mat-button
            routerLink="/candidates"
            routerLinkActive="active"
            class="nav-link"
          >
            <mat-icon>groups</mat-icon>
            <span>Candidates</span>
          </a>

          <a
            mat-button
            routerLink="/jobs"
            routerLinkActive="active"
            class="nav-link"
          >
            <mat-icon>work</mat-icon>
            <span>Jobs</span>
          </a>

          @if (isAdmin) {
            <a
              mat-button
              routerLink="/users"
              routerLinkActive="active"
              class="nav-link"
            >
              <mat-icon>group</mat-icon>
              <span>Users</span>
            </a>
          }
        }
      </div>

      <div class="sidebar-footer">
        <button mat-button (click)="logout()" class="logout-btn nav-link">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </div>
    </nav>

    <main class="app-main">
      <router-outlet />
    </main>
  </div>
</div>
