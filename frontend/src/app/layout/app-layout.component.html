<div class="app-layout">
  <header class="app-header">
    <a mat-button routerLink="/" class="app-logo">HireFlow</a>
    <span class="app-header-spacer"></span>
    <button mat-icon-button class="profile-icon" aria-label="Profile">
      <mat-icon>account_circle</mat-icon>
    </button>
  </header>
  <div class="app-body">
    <nav class="app-sidebar">
      <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Dashboard
      </a>
      <a mat-button routerLink="/candidates" routerLinkActive="active">Candidates</a>
      <a mat-button routerLink="/jobs" routerLinkActive="active">Jobs</a>
      <button mat-button (click)="logout()" class="logout-btn">Logout</button>
    </nav>
    <main class="app-main">
      <router-outlet />
    </main>
  </div>
</div>
