<h2 mat-dialog-title>{{ dialogTitle }}</h2>

<mat-dialog-content>
  <form class="job-form" (ngSubmit)="save()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Title</mat-label>
      <input matInput [(ngModel)]="title" name="title" required autocomplete="off" />
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline" class="half">
        <mat-label>Department</mat-label>
        <input matInput [(ngModel)]="department" name="department" placeholder="Engineering" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="half">
        <mat-label>Location</mat-label>
        <input matInput [(ngModel)]="location" name="location" placeholder="Remote" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea
        matInput
        [(ngModel)]="description"
        name="description"
        rows="4"
        placeholder="Role overview, responsibilities, requirements..."
      ></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Status</mat-label>
      <mat-select [(ngModel)]="status" name="status">
        <mat-option value="Open">Open</mat-option>
        <mat-option value="Closed">Closed</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">
    {{ isEdit ? 'Save' : 'Create' }}
  </button>
</mat-dialog-actions>
